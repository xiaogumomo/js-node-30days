
name: CI
on: [push,pull_request]

jobs:
   test:
      # ⚠️ 2026-10-10（Day 24 换 Postgres 引擎后加的）：判据现在连的是**真库** ——
      #   每个测试文件一个独立测试库（见 projects/p2-task-api/tools/testkit.js），
      #   默认连 127.0.0.1:5432；下面这个 service 正好把它暴露在 runner 的 localhost 上。
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: tasks
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      runs-on: ubuntu-latest   
      steps: 
        - uses: actions/checkout@v4
        
        - uses: actions/setup-node@v4
          with:
             node-version: '24.21.0'

        - uses: pnpm/action-setup@v4
          with:
             version: '12.8.1'
        - name: 装依赖（三个包各自frozen）
          run: |
            pnpm install --frozen-lockfile --dir week1-language/p0-toolkit
            pnpm install --frozen-lockfile --dir projects/p2-task-api
            pnpm install --frozen-lockfile --dir  projects/p1-cli-organizer

        - name: 类型检查
          working-directory : week1-language/p0-toolkit
          run: pnpm exec tsc --noEmit 

        - name: 全局判据（仓库根，自动发现）
          run: node --test



